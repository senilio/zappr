name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build release mode
        run: go build -trimpath -ldflags "-s -w -X github.com/senilio/zappr/internal/cli.Version=ci" -o /tmp/zappr ./cmd/zappr
