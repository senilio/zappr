name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build release mode
        run: go build -trimpath -ldflags "-s -w -X github.com/senilio/zappr/internal/cli.Version=ci" -o /tmp/zappr ./cmd/zappr
